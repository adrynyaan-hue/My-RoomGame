name: Build MyRoom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract MyRoom project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o MyRoomGame_ready_for_GitHub.zip -d project

      - name: Configure AndroidX and JVM 17
        working-directory: project
        run: |
          touch gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle tidak ditemukan")

          text = p.read_text()

          # Java 8 -> Java 17
          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # Kotlin 1.8/8 -> Kotlin 17
          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '1.8'",
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '8'",
              'jvmTarget = "17'"
          )

          p.write_text(text)
          PY

      - name: Create JVM 17 Gradle configuration
        working-directory: project
        run: |
          cat > force-jvm17.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          // Force every Java compiler task to JVM 17
          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          // Force Kotlin compiler tasks to JVM 17
          tasks.configureEach { task ->
              if (task.name.toLowerCase().contains("kotlin")) {
                  try {
                      task.kotlinOptions.jvmTarget = "17"
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

      - name: Check project
        working-directory: project
        run: |
          echo "=============================="
          echo "JAVA VERSION"
          echo "=============================="
          java -version

          echo "=============================="
          echo "GRADLE VERSION"
          echo "=============================="
          gradle --version

          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="
          ls -la

          echo "=============================="
          echo "APP FILES"
          echo "=============================="
          ls -la app

          echo "=============================="
          echo "APP BUILD.GRADLE"
          echo "=============================="
          cat app/build.gradle

      - name: Build APK
        working-directory: project
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            -I force-jvm17.gradle \
            :app:assembleDebug

      - name: Check APK
        working-directory: project
        run: |
          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="

          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRoom-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error