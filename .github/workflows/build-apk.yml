name: Build MyRoom APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract MyRoom project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o MyRoomGame_ready_for_GitHub.zip -d project

      - name: Configure AndroidX and JVM 17
        working-directory: project
        run: |
          touch gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle tidak ditemukan")

          text = p.read_text()

          # ==========================================
          # FORCE JAVA TARGET 17
          # ==========================================

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          text = re.sub(
              r'(sourceCompatibility\s*[=:]\s*)["\']?1\.8["\']?',
              r'\g<1>JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'(targetCompatibility\s*[=:]\s*)["\']?1\.8["\']?',
              r'\g<1>JavaVersion.VERSION_17',
              text
          )

          # ==========================================
          # FORCE KOTLIN JVM TARGET 17
          # ==========================================

          text = re.sub(
              r'jvmTarget\s*=\s*["\']1\.8["\']',
              'jvmTarget = "17"',
              text
          )

          text = re.sub(
              r'jvmTarget\s*=\s*["\']8["\']',
              'jvmTarget = "17"',
              text
          )

          # ==========================================
          # ADD/OVERRIDE ANDROID COMPILE OPTIONS
          # ==========================================

          if "compileOptions" not in text:
              text += '''

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
'''
          else:
              text = re.sub(
                  r'sourceCompatibility\s+JavaVersion\.VERSION_\d+',
                  'sourceCompatibility JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'targetCompatibility\s+JavaVersion\.VERSION_\d+',
                  'targetCompatibility JavaVersion.VERSION_17',
                  text
              )

          # ==========================================
          # ADD/OVERRIDE KOTLIN JVM TARGET
          # ==========================================

          if "kotlinOptions" not in text:
              text += '''

android {
    kotlinOptions {
        jvmTarget = "17"
    }
}
'''
          else:
              text = re.sub(
                  r'jvmTarget\s*=\s*["\'](?:1\.8|8|\d+)["\']',
                  'jvmTarget = "17"',
                  text
              )

          p.write_text(text)

          print("====================================")
          print("JVM 17 configuration applied")
          print("====================================")
          print(text)
          PY

      - name: Force Java and Kotlin tasks to JVM 17
        working-directory: project
        run: |
          cat > force-jvm17.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.matching {
              it.name.toLowerCase().contains("kotlin")
          }.configureEach {
              try {
                  compilerOptions.jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              } catch (Exception ignored) {
                  try {
                      kotlinOptions.jvmTarget = "17"
                  } catch (Exception ignored2) {
                  }
              }
          }
          EOF

      - name: Check project
        working-directory: project
        run: |
          echo "=== Java version ==="
          java -version

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Project files ==="
          ls -la

          echo "=== App files ==="
          ls -la app

          echo "=== Final app/build.gradle ==="
          cat app/build.gradle

      - name: Build APK
        working-directory: project
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            -I force-jvm17.gradle \
            :app:assembleDebug

      - name: Find APK
        working-directory: project
        run: |
          echo "=== APK files ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRoom-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error