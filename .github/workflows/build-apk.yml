name: Build MyRoom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract MyRoom project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o MyRoomGame_ready_for_GitHub.zip -d project

      - name: Configure AndroidX
        working-directory: project
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Fix Java and Kotlin JVM 17
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle tidak ditemukan")

          text = p.read_text()

          # Hapus konfigurasi lama jika ada
          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '1.8'",
              'jvmTarget = "17"'
          )

          # Tambahkan compileOptions Java 17
          if "compileOptions" not in text:
              marker = "android {"

              if marker not in text:
                  raise SystemExit("ERROR: blok android {} tidak ditemukan")

              replacement = """android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }"""

              text = text.replace(marker, replacement, 1)

          # Pastikan Kotlin target 17
          if "kotlinOptions" not in text:
              text += """

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}
"""

          p.write_text(text)

          print("================================")
          print("FINAL app/build.gradle")
          print("================================")
          print(text)
          PY

      - name: Check JVM configuration
        working-directory: project
        run: |
          echo "=== JAVA VERSION ==="
          java -version

          echo "=== GRADLE VERSION ==="
          gradle --version

          echo "=== APP BUILD.GRADLE ==="
          cat app/build.gradle

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        working-directory: project
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRoom-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error