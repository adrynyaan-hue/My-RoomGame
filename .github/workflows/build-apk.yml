name: Build MyRoom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract MyRoom project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o MyRoomGame_welcome_redesign.zip -d project

      - name: Configure AndroidX
        working-directory: project
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Force Java and Kotlin to JVM 17
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle tidak ditemukan")

          text = p.read_text()

          # Semua referensi Java 8 -> Java 17
          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # Semua Kotlin JVM target 1.8 -> 17
          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '1.8'",
              'jvmTarget = "17"'
          )

          # Kalau ada angka 1.8 pada source/target compatibility
          text = text.replace(
              'sourceCompatibility = "1.8"',
              'sourceCompatibility = "17"'
          )

          text = text.replace(
              'targetCompatibility = "1.8"',
              'targetCompatibility = "17"'
          )

          # Tambahkan konfigurasi Android Java 17 jika belum ada
          if "compileOptions" not in text:
              text = text.replace(
                  "android {",
                  """android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
""",
                  1
              )

          # Paksa task JavaCompile langsung
          text += """

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = "17"
    targetCompatibility = "17"
    options.release.set(17)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}
"""

          p.write_text(text)

          print("=== FINAL BUILD.GRADLE ===")
          print(text)
          PY

      - name: Verify JVM configuration
        working-directory: project
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== SEARCH JVM SETTINGS ==="
          grep -nE "VERSION_1_8|VERSION_8|1.8|VERSION_17|jvmTarget|sourceCompatibility|targetCompatibility|options.release" app/build.gradle || true

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        working-directory: project
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRoom-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
