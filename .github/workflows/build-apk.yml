name: Build MyRoom APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract MyRoom project
        run: unzip -o MyRoomGame_ready_for_GitHub.zip -d project
     
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" > project/gradle.properties
      
      - name: Build APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRoom-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
