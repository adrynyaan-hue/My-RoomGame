name: Build MyRoom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract MyRoom project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o MyRoomGame_welcome_redesign.zip -d project

      - name: Configure AndroidX
        working-directory: project
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

      - name: Fix JVM target
        working-directory: project
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle
          sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' app/build.gradle
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" app/build.gradle

      - name: Show configuration
        working-directory: project
        run: |
          echo "=== BUILD.GRADLE ==="
          cat app/build.gradle
          echo "=== GRADLE.PROPERTIES ==="
          cat gradle.properties

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRoom-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
