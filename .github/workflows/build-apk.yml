name: Build MyRoom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract MyRoom project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o MyRoomGame_welcome_redesign.zip -d project

      - name: Configure AndroidX
        working-directory: project
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Force Java and Kotlin JVM 17
        working-directory: project
        run: |
          cat >> app/build.gradle <<'EOF'

          // Force Java compilation to JVM 17
          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          // Force Kotlin compilation to JVM 17
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Check project
        working-directory: project
        run: |
          echo "=== PROJECT ==="
          ls -la

          echo "=== APP ==="
          ls -la app

          echo "=== BUILD.GRADLE ==="
          cat app/build.gradle

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        working-directory: project
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRoom-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
